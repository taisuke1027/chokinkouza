<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>積立貯筋口座</title>
<meta name="description" content="運動を身体への投資と捉え、身体資産を積み立てていくトレーニング記録アプリ" />
<meta name="theme-color" content="#F6F1E6" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="貯筋口座" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">
  <header class="app-header">
    <div class="brand">
      <span class="mark">積</span>
      <span class="title">積立貯筋口座</span>
    </div>
    <div class="season-chip" id="seasonChip">Season 1</div>
  </header>

  <main class="view" id="mainView"></main>

  <nav class="bottom-nav" id="bottomNav">
    <button data-view="home"><span class="icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5a1 1 0 0 0 1 1H9v-6h6v6h2.5a1 1 0 0 0 1-1V10"/></svg></span>ホーム</button>
    <button data-view="record"><span class="icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>記録</button>
    <button data-view="asset"><span class="icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V12M10 20V6M16 20v-9M2 20h20"/></svg></span>資産</button>
    <button data-view="ledger"><span class="icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6M9 12h6"/></svg></span>履歴</button>
    <button data-view="more"><span class="icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>その他</button>
  </nav>
</div>

<div id="overlayRoot"></div>
<div id="toastRoot"></div>

<!-- データ層 -->
<script src="js/data/config.js"></script>
<script src="js/data/exercises.js"></script>
<script src="js/data/models.js"></script>
<script src="js/data/storage.js"></script>

<!-- 計算エンジン -->
<script src="js/engine/cardioCalculator.js"></script>
<script src="js/engine/strengthCalculator.js"></script>
<script src="js/engine/enduranceCalculator.js"></script>
<script src="js/engine/decayCalculator.js"></script>
<script src="js/engine/habitCalculator.js"></script>
<script src="js/engine/bptCalculator.js"></script>
<script src="js/engine/seasonManager.js"></script>

<!-- UI -->
<script src="js/ui/format.js"></script>
<script src="js/ui/icons.js"></script>
<script src="js/ui/chart.js"></script>
<script src="js/ui/picker.js"></script>
<script src="js/ui/confirm.js"></script>
<script src="js/ui/home.js"></script>
<script src="js/ui/bptInfo.js"></script>
<script src="js/ui/pressureInfo.js"></script>
<script src="js/ui/habitInfo.js"></script>
<script src="js/ui/record.js"></script>
<script src="js/ui/exercisePicker.js"></script>
<script src="js/ui/template.js"></script>
<script src="js/ui/result.js"></script>
<script src="js/ui/edit.js"></script>
<script src="js/ui/asset.js"></script>
<script src="js/ui/ledger.js"></script>
<script src="js/ui/seasons.js"></script>
<script src="js/ui/science.js"></script>
<script src="js/ui/more.js"></script>
<script src="js/ui/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
